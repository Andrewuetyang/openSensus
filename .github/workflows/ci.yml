name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Without these the two PostgreSQL suites skip themselves, so CI would
      # silently stop covering the second backend.
      SENSUS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sensus_test
      SENSUS_TEST_DATABASE_URL_E2E: postgres://postgres:postgres@127.0.0.1:5432/sensus_e2e_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Reject a lockfile pinned to a non-public registry
        run: npm run check:lockfile

      - name: Build and test
        run: npm test

      - name: Confirm the PostgreSQL suites were not skipped
        run: |
          set -o pipefail
          node --test --test-reporter=tap \
            dist/test/storage-postgres.test.js dist/test/postgres-e2e.test.js \
            | tee /tmp/pg.tap
          if grep -q "^ *not ok.*# SKIP\|# SKIP" /tmp/pg.tap; then
            echo "::error::A PostgreSQL suite skipped even though a database was configured."
            exit 1
          fi
