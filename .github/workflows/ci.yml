name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # The conformance suite connects to the database in
          # SENSUS_TEST_DATABASE_URL without creating it, so it has to exist.
          # The end-to-end suite creates its own from the maintenance database.
          POSTGRES_DB: sensus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Without these the two PostgreSQL suites skip themselves, so CI would
      # silently stop covering the second backend. The step below fails if that
      # happens anyway.
      SENSUS_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sensus_test
      SENSUS_TEST_DATABASE_URL_E2E: postgres://postgres:postgres@127.0.0.1:5432/sensus_e2e_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Reject a lockfile pinned to a non-public registry
        run: npm run check:lockfile

      - name: Build and test
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/test.tap

      - name: Fail if a suite skipped while a database was configured
        run: |
          # A skip here means a backend quietly stopped being covered.
          if grep -q "# SKIP" /tmp/test.tap; then
            echo "::error::A suite skipped even though PostgreSQL was configured:"
            grep "# SKIP" /tmp/test.tap
            exit 1
          fi
